"$schema" = 'https://starship.rs/config-schema.json'
format = "$custom$time"
add_newline = false

[custom.prefix_active]
when = 'test "${TMUX_CLIENT_PREFIX:-0}" = "1"'
command = 'printf "󰇄 %s" "${TMUX_SESSION_NAME:-tmux}"'
format = "[$output]($style) "
style = "bg:#82aaff fg:#1e2030 bold"

[custom.session_normal]
when = 'test "${TMUX_CLIENT_PREFIX:-0}" != "1"'
command = 'printf "󰇄 %s" "${TMUX_SESSION_NAME:-tmux}"'
format = "[$output]($style) "
style = "fg:#636da6"

[time]
disabled = false
format = "[$time]($style) "
style = "fg:#4fd6be"
time_format = "%H:%M:%S"
