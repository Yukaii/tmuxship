name = "Catppuccin Mocha"
description = "Soothing pastel dark theme with deep contrast and rich vibrant accents"
author = "Catppuccin Org"
variant = "dark"
window_separator = " • "

[[swatches]]
name = "Teal"
hex = "#94e2d5"

[[swatches]]
name = "Blue"
hex = "#89b4fa"

[[swatches]]
name = "Green"
hex = "#a6e3a1"

[[swatches]]
name = "Yellow"
hex = "#f9e2af"

[[swatches]]
name = "Mauve"
hex = "#cba6f7"

[[swatches]]
name = "Surface"
hex = "#313244"

[left]
"$schema" = 'https://starship.rs/config-schema.json'
format = "$custom"
add_newline = false
[left.custom.prefix_active]
when = 'test "${TMUX_CLIENT_PREFIX:-0}" = "1"'
command = 'printf "󰇄 %s" "${TMUX_SESSION_NAME:-tmux}"'
format = "[$output]($style) "
style = "bg:#95E6CB fg:#11111b bold"
[left.custom.session_normal]
when = 'test "${TMUX_CLIENT_PREFIX:-0}" != "1"'
command = 'printf "󰇄 %s" "${TMUX_SESSION_NAME:-tmux}"'
format = "[$output]($style) "
style = "fg:#565B66"

[center]
format = "$custom"
add_newline = false
[center.custom.window_active]
when = 'test "${TMUX_WINDOW_ACTIVE:-0}" = "1"'
command = 'printf "%s:%s" "${TMUX_WINDOW_INDEX:-1}" "${TMUX_WINDOW_NAME:-sh}"'
format = "[$output]($style)"
style = "bg:#313244 fg:#CDD6F4 bold"
[center.custom.window_inactive]
when = 'test "${TMUX_WINDOW_ACTIVE:-0}" != "1"'
command = 'printf "%s:%s" "${TMUX_WINDOW_INDEX:-1}" "${TMUX_WINDOW_NAME:-sh}"'
format = "[$output]($style)"
style = "fg:#6C7086"
[center.custom.window_zoom]
when = 'test "${TMUX_WINDOW_ACTIVE:-0}" = "1" && test "${TMUX_WINDOW_ZOOMED_FLAG:-0}" = "1"'
command = 'printf "🔍"'
format = " $output"
style = "fg:#F9E2AF"

[right]
"$schema" = 'https://starship.rs/config-schema.json'
format = "$time$custom"
add_newline = false
[right.time]
disabled = false
format = "[$time]($style) "
style = "fg:#89B4FA"
time_format = "%H:%M:%S"
[right.custom.host]
when = "true"
shell = "bash"
command = 'printf "%s" "${TMUX_HOST_SHORT:-$(hostname -s)}"'
format = "on [$output]($style) "
style = "fg:#A6E3A1"
[right.custom.window_count]
when = "true"
shell = "bash"
command = 'printf "%s" "${TMUX_SESSION_WINDOWS:-1}"'
format = "[󰖲 $output]($style)"
style = "fg:#CBA6F7"
