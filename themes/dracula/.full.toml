"$schema" = 'https://starship.rs/config-schema.json'
format = "$custom$time"
add_newline = false

[custom.prefix_active]
when = 'test "${TMUX_CLIENT_PREFIX:-0}" = "1"'
command = 'printf "󰇄 %s" "${TMUX_SESSION_NAME:-tmux}"'
format = "[$output]($style) "
style = "bg:#bd93f9 fg:#282a36 bold"

[custom.session_normal]
when = 'test "${TMUX_CLIENT_PREFIX:-0}" != "1"'
command = 'printf "󰇄 %s" "${TMUX_SESSION_NAME:-tmux}"'
format = "[$output]($style) "
style = "fg:#6272a4"

[time]
disabled = false
format = "[$time]($style) "
style = "fg:#8be9fd"
time_format = "%H:%M:%S"
