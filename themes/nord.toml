name = "Nord"
description = "An arctic, north-bluish clean color palette for an optimal visual workflow"
author = "Arctic Ice Studio"
variant = "dark"
window_separator = " • "

[[swatches]]
name = "Frost Blue"
hex = "#88c0d0"

[[swatches]]
name = "Dark Frost"
hex = "#81a1c1"

[[swatches]]
name = "Aurora Green"
hex = "#a3be8c"

[[swatches]]
name = "Aurora Yellow"
hex = "#ebcb8b"

[[swatches]]
name = "Aurora Purple"
hex = "#b48ead"

[left]
"$schema" = 'https://starship.rs/config-schema.json'
format = "$custom"
add_newline = false
[left.custom.prefix_active]
when = 'test "${TMUX_CLIENT_PREFIX:-0}" = "1"'
command = 'printf "󰇄 %s" "${TMUX_SESSION_NAME:-tmux}"'
format = "[$output]($style) "
style = "bg:#88c0d0 fg:#2e3440 bold"
[left.custom.session_normal]
when = 'test "${TMUX_CLIENT_PREFIX:-0}" != "1"'
command = 'printf "󰇄 %s" "${TMUX_SESSION_NAME:-tmux}"'
format = "[$output]($style) "
style = "fg:#4c566a"

[center]
format = "$custom"
add_newline = false
[center.custom.window_active]
when = 'test "${TMUX_WINDOW_ACTIVE:-0}" = "1"'
command = 'printf "%s:%s" "${TMUX_WINDOW_INDEX:-1}" "${TMUX_WINDOW_NAME:-sh}"'
format = "[$output]($style)"
style = "bg:#3b4252 fg:#eceff4 bold"
[center.custom.window_inactive]
when = 'test "${TMUX_WINDOW_ACTIVE:-0}" != "1"'
command = 'printf "%s:%s" "${TMUX_WINDOW_INDEX:-1}" "${TMUX_WINDOW_NAME:-sh}"'
format = "[$output]($style)"
style = "fg:#4c566a"
[center.custom.window_zoom]
when = 'test "${TMUX_WINDOW_ACTIVE:-0}" = "1" && test "${TMUX_WINDOW_ZOOMED_FLAG:-0}" = "1"'
command = 'printf "🔍"'
format = " $output"
style = "fg:#ebcb8b"

[right]
"$schema" = 'https://starship.rs/config-schema.json'
format = "$time$custom"
add_newline = false
[right.time]
disabled = false
format = "[$time]($style) "
style = "fg:#81a1c1"
time_format = "%H:%M:%S"
[right.custom.host]
when = "true"
shell = "bash"
command = 'printf "%s" "${TMUX_HOST_SHORT:-$(hostname -s)}"'
format = "on [$output]($style) "
style = "fg:#a3be8c"
[right.custom.window_count]
when = "true"
shell = "bash"
command = 'printf "%s" "${TMUX_SESSION_WINDOWS:-1}"'
format = "[󰖲 $output]($style)"
style = "fg:#b48ead"
