name = "Rosé Pine Moon"
description = "Cozy blend of warm and cool night hues for low-light focus"
author = "Rose Pine"
variant = "dark"
window_separator = " • "

[[swatches]]
name = "Love"
hex = "#eb6f92"

[[swatches]]
name = "Gold"
hex = "#f6c177"

[[swatches]]
name = "Rose"
hex = "#ea9a97"

[[swatches]]
name = "Pine"
hex = "#3e8fb0"

[[swatches]]
name = "Foam"
hex = "#9ccfd8"

[[swatches]]
name = "Iris"
hex = "#c4a7e7"

[left]
"$schema" = 'https://starship.rs/config-schema.json'
format = "$custom"
add_newline = false
[left.custom.prefix_active]
when = 'test "${TMUX_CLIENT_PREFIX:-0}" = "1"'
command = 'printf "󰇄 %s" "${TMUX_SESSION_NAME:-tmux}"'
format = "[$output]($style) "
style = "bg:#eb6f92 fg:#232136 bold"
[left.custom.session_normal]
when = 'test "${TMUX_CLIENT_PREFIX:-0}" != "1"'
command = 'printf "󰇄 %s" "${TMUX_SESSION_NAME:-tmux}"'
format = "[$output]($style) "
style = "fg:#908caa"

[center]
format = "$custom"
add_newline = false
[center.custom.window_active]
when = 'test "${TMUX_WINDOW_ACTIVE:-0}" = "1"'
command = 'printf "%s:%s" "${TMUX_WINDOW_INDEX:-1}" "${TMUX_WINDOW_NAME:-sh}"'
format = "[$output]($style)"
style = "bg:#393552 fg:#ea9a97 bold"
[center.custom.window_inactive]
when = 'test "${TMUX_WINDOW_ACTIVE:-0}" != "1"'
command = 'printf "%s:%s" "${TMUX_WINDOW_INDEX:-1}" "${TMUX_WINDOW_NAME:-sh}"'
format = "[$output]($style)"
style = "fg:#6e6a86"
[center.custom.window_zoom]
when = 'test "${TMUX_WINDOW_ACTIVE:-0}" = "1" && test "${TMUX_WINDOW_ZOOMED_FLAG:-0}" = "1"'
command = 'printf "🔍"'
format = " $output"
style = "fg:#f6c177"

[right]
"$schema" = 'https://starship.rs/config-schema.json'
format = "$time$custom"
add_newline = false
[right.time]
disabled = false
format = "[$time]($style) "
style = "fg:#9ccfd8"
time_format = "%H:%M:%S"
[right.custom.host]
when = "true"
shell = "bash"
command = 'printf "%s" "${TMUX_HOST_SHORT:-$(hostname -s)}"'
format = "on [$output]($style) "
style = "fg:#3e8fb0"
[right.custom.window_count]
when = "true"
shell = "bash"
command = 'printf "%s" "${TMUX_SESSION_WINDOWS:-1}"'
format = "[󰖲 $output]($style)"
style = "fg:#c4a7e7"
