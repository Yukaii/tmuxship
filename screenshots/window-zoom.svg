<svg width="20ch" height="1.3em" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve">
    <style>
        * {
            font-family: Courier, monospace;
            font-size: 13px;
        }
        tspan, text {
            font-variant-ligatures: none;
            dominant-baseline: central;
            white-space: pre;
            fill: #bbbbbb;
        }
        .bg {
            stroke-width: "0.5px";
        }
        .bold {
            font-weight: bold;
        }
        <!-- Background custom colors -->
        .bc0 { stroke: #313244; fill: #313244; }
        <!-- Foreground custom colors -->
        .fc0 { fill: #cdd6f4; }
    </style>
    <rect width="100%" height="100%" x="0" y="0" style="fill: #000000"/>
<g class="bg">
<rect x="0ch" y="0em" width="8ch" height="1.3em" class="bc0"/>
</g>
<text x="0ch" y="0.65em"><tspan class="bold fc0">0:editor </tspan><tspan>🔍</tspan></text>
</svg>
