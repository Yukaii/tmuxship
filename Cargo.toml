[package]
name = "tmuxship"
version = "0.1.0"
edition = "2021"
description = "A Starship-to-tmux adapter that renders tmux-ready status lines from Starship JSON output"
authors = ["Yukai Huang <yukai@yukaihuang.com>"]
license = "MIT"
repository = "https://github.com/Yukaii/tmuxship"
homepage = "https://github.com/Yukaii/tmuxship"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
